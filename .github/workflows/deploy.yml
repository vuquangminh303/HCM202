name: Deploy to VPS

on:
  push:
    branches: [ "main" ]   # đổi thành master nếu repo bạn dùng master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/creative_product_HCM202
            git pull
            docker compose up -d --build