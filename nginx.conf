# 1) HTTP -> HTTPS redirect
server {
    listen 80;
    server_name smartnovi.tech www.smartnovi.tech;

    # Let's Encrypt challenge (không bắt buộc nếu bạn cấp cert bằng certbot --nginx,
    # nhưng để sẵn cũng ok)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

# 2) HTTPS server
server {
    listen 443 ssl http2;
    server_name smartnovi.tech www.smartnovi.tech;

    ssl_certificate     /etc/letsencrypt/live/smartnovi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartnovi.tech/privkey.pem;

    # (khuyên thêm) TLS settings cơ bản
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # CSP (giữ nguyên của bạn)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.youtube.com; object-src 'none';" always;
}