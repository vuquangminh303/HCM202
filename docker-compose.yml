services:
    app:
      build:
        context: .
        dockerfile: Dockerfile
      expose:
        - '80'
      restart: unless-stopped
      environment:
        - NODE_ENV=production
      healthcheck:
        test:
          - CMD
          - wget
          - '--quiet'
          - '--tries=1'
          - '--spider'
          - 'http://localhost'
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      labels:
        - traefik.enable=true
        - traefik.docker.network=coolify
        - traefik.http.routers.app-https.rule=Host(`hcm202.smartnovi.tech`)
        - traefik.http.routers.app-https.entrypoints=https
        - traefik.http.routers.app-https.tls=true
        - traefik.http.routers.app-https.tls.certresolver=letsencrypt
        - traefik.http.services.app.loadbalancer.server.port=80
        - traefik.http.routers.app-http.rule=Host(`hcm202.smartnovi.tech`)
        - traefik.http.routers.app-http.entrypoints=http
        - traefik.http.routers.app-http.middlewares=redirect-https@docker
        - traefik.http.middlewares.redirect-https.redirectscheme.scheme=https
        - traefik.http.middlewares.redirect-https.redirectscheme.permanent=true
      networks:
        - coolify

networks:
    coolify:
      external: true
