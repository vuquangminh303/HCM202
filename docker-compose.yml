services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        - CMD
        - wget
        - '--quiet'
        - '--tries=1'
        - '--spider'
        - 'http://localhost'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.docker.network=coolify
    networks:
      - coolify

networks:
  coolify:
    external: true
