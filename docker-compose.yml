version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8081:80"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # nếu bạn có dùng acme-challenge
      - /var/www/certbot:/var/www/certbot

    restart: unless-stopped

    environment:
      - NODE_ENV=production

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s